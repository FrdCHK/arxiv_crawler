user:
  name: "example_user"

data:
  database:
    path: "data/arxiv.db"
  # Load papers first seen in the past N UTC days.
  recent_days: 2

interest: |
  Radio astronomy, Very Long Baseline Interferometry (VLBI).

llm:
  base_url: "http://127.0.0.1:8080/v1"
  model: "bigatuna/Qwen3.5-9b-Sushi-Coder-RL-GGUF:Q8_0"
  timeout_sec: 600
  batch_size: 5
  temperature: 0.0
  max_tokens: 100000
  log_raw_response: false
  raw_response_log_file: "llm_raw_output.log"

selection:
  threshold: 30

output:
  save_html: true
  output_dir: "output"
  html_file: "arxiv_selected_{user}_{date}.html"
  send_email: false
