arxiv:
  api_url: "http://export.arxiv.org/api/query"
  category: "astro-ph*"
  max_results: 2000
  user_agent: "arxiv auto bot (personal use; contact: zjd98@sina.cn)"

download:
  # Rolling window size for backfill/review-delay robustness.
  lookback_days: 4
  # Usually keep this as yesterday for cron.
  anchor_date_utc: "yesterday"

  database:
    path: "data/arxiv.db"

  # Optional compatibility output; can be disabled.
  save_daily_json: true
  data_dir: "data"
