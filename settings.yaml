arxiv:
  api_url: "http://export.arxiv.org/api/query"
  category: "astro-ph*"
  max_results: 1000
  user_agent: "J. Zhang (personal use; GitHub repo: FrdCHK/arxiv_crawler)"

download:
  # Rolling window size for backfill/review-delay robustness.
  lookback_days: 7
  # Usually keep this as yesterday for cron.
  anchor_date_utc: "yesterday"
  # Wait time between requests for different UTC days.
  request_interval_sec: 5
  # Wait time before retrying a failed API request (including non-200 responses).
  retry_interval_sec: 60
  # 0 means retry forever; positive integer means max attempts.
  max_retry_attempts: 1000

  database:
    path: "data/arxiv.db"

  # Optional compatibility output; can be disabled.
  save_daily_json: true
  data_dir: "data"
